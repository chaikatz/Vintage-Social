<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VINTAGE</title>
<meta name="description" content="VINTAGE is a private social network for photographs worth keeping. Membership by invitation.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vintagesocial.app/">
<meta property="og:title" content="VINTAGE">
<meta property="og:description" content="A private social network for photographs worth keeping. Membership by invitation.">
<meta property="og:image" content="https://vintagesocial.app/invite-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico">
<script type="importmap">
{
  "imports": {
    "three": "/3d/vendor/three.module.js",
    "three/addons/controls/OrbitControls.js": "/3d/vendor/OrbitControls.js"
  }
}
</script>
<style>
  /*
   * The app's front door (app/(gate)/landing.tsx), set in HTML: the same
   * cream, the same ink, the same three ways in — with the 3D V standing
   * where the three prints lay, the name small in the corner, and the ways
   * in as words alone, each signed with the short rule. Tokens are the
   * light print of src/theme.
   */
  :root {
    color-scheme: light;
    --paper: #FAF6EF;
    --ink: #2B2620;
    --ink-faint: #9C927F;
    --serif: Georgia, "Times New Roman", serif;
    --mono: "Courier New", Courier, monospace;
    /* A print was about a third of the page wide; the stage still takes its measure from that. */
    --pw: min(31vw, 132px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  .page {
    position: relative;
    min-height: 100vh; min-height: 100dvh;
    max-width: 430px; margin: 0 auto;
    padding: env(safe-area-inset-top) 40px max(env(safe-area-inset-bottom), 16px);
    display: flex; flex-direction: column;
  }
  .space { flex: 1; min-height: 8px; }
  .space.a { flex: 1.1; } .space.b { flex: 0.8; } .space.c { flex: 1; } .space.d { flex: 0.6; }
  @media (max-height: 719px) {
    .space.a { flex: 0.5; } .space.b { flex: 0.4; } .space.c { flex: 0.5; } .space.d { flex: 0.3; }
  }
  /* The name, small, in the corner — the V is the centrepiece. The logo is
     the app's wordmark at 36%: 42px/50px, tracked 11px, its 24px rule 8px
     beneath — every measure scaled the same, the rule still centred. */
  .top {
    position: absolute; z-index: 2; left: 24px; top: calc(env(safe-area-inset-top) + 22px);
    display: flex; flex-direction: column; align-items: center;
  }
  h1 {
    margin: 0; font: 400 15px/18px var(--serif); letter-spacing: 4px; text-indent: 4px;
    color: var(--ink);
  }
  .rule { width: 24px; height: 1px; background: var(--ink); opacity: .85; margin-top: 8px; }
  .top .rule { width: 9px; margin-top: 3px; }

  vintage-stage:not(:defined) { visibility: hidden; }
  vintage-stage {
    --stage-bg: var(--paper); --stage-ink: var(--ink);
    /* the room the wordmark and the prints had, together, so the ways in keep their place */
    display: block; height: calc(var(--pw) * 2.1 + 59px);
    width: calc(100% + 80px); margin: 0 -40px;
  }

  .actions { display: flex; flex-direction: column; align-items: center; }
  /* Words alone, in the same place the buttons stood, each signed with the short rule. */
  .button {
    height: 44px; margin-bottom: 10px; padding: 0 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: 400 11px/1 var(--mono); letter-spacing: 2.4px; text-transform: uppercase;
    color: var(--ink); text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .button:active, .sign-in:active { opacity: .8; }
  .button .rule { width: 26px; margin-top: 7px; opacity: .8; }
  .sign-in {
    margin-top: 12px; padding: 4px 10px;
    display: flex; flex-direction: column; align-items: center;
    font: 400 12px/1 var(--mono); letter-spacing: 3px; text-transform: uppercase;
    color: var(--ink); text-decoration: none;
  }
  .sign-in .rule { width: 26px; margin-top: 7px; opacity: .8; }

  .foot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .foot, .foot a {
    font: 400 9px/1.3 var(--mono); letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--ink-faint); text-decoration: none;
  }
  .legal { display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="page">
  <div class="space a"></div>
  <div class="top">
    <h1>VINTAGE</h1>
    <div class="rule"></div>
  </div>
  <div class="space b"></div>

  <vintage-stage minimal aria-label="The VINTAGE mark, a serif V, turning"></vintage-stage>

  <div class="space c"></div>
  <nav class="actions" aria-label="Ways in">
    <a class="button" href="/apply">Apply for membership<span class="rule"></span></a>
    <a class="button" href="/invite">I have an invitation<span class="rule"></span></a>
    <a class="sign-in" href="/sign-in">Sign in<span class="rule"></span></a>
  </nav>

  <div class="space d"></div>
  <div class="foot">
    <span>Members only · Est. 2026</span>
    <div class="legal"><a href="/privacy">Privacy</a><span>·</span><a href="/terms">Terms</a></div>
  </div>
</div>

<script src="/3d/stage.js?v=4"></script>
<script type="module">
  import { mountVintageMark } from '/3d/mark.js?v=4';
  mountVintageMark(document.querySelector('vintage-stage'), { fill: 1.3 }).catch(() => { /* the stage shows the mark still, in SVG */ });
</script>
</body>
</html>
